<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FitBuddy - AI Fitness Generator</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>

<body>

<div class="page">

    <div class="card">

        <div class="logo">
            💪
        </div>

        <h1>FitBuddy</h1>

        <p class="subtitle">
            AI Fitness Plan Generator
        </p>

        <p class="description">
            Create a personalized 7-day workout plan
            using Generative AI.
        </p>


        <form
            action="/generate-workout"
            method="POST"
        >

            <!-- NAME -->

            <div class="form-group">

                <label for="username">
                    Name
                </label>

                <input
                    id="username"
                    type="text"
                    name="username"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <!-- USER ID -->

            <div class="form-group">

                <label for="user_id">
                    User ID
                </label>

                <input
                    id="user_id"
                    type="text"
                    name="user_id"
                    placeholder="Example: USER001"
                    required
                >

            </div>


            <!-- AGE -->

            <div class="form-group">

                <label for="age">
                    Age
                </label>

                <input
                    id="age"
                    type="number"
                    name="age"
                    min="13"
                    max="100"
                    placeholder="Enter your age"
                    required
                >

            </div>


            <!-- WEIGHT -->

            <div class="form-group">

                <label for="weight">
                    Weight (kg)
                </label>

                <input
                    id="weight"
                    type="number"
                    name="weight"
                    min="1"
                    max="500"
                    step="0.1"
                    placeholder="Enter your weight"
                    required
                >

            </div>


            <!-- GOAL -->

            <div class="form-group">

                <label for="goal">
                    Fitness Goal
                </label>

                <select
                    id="goal"
                    name="goal"
                    required
                >

                    <option value="weight loss">
                        Weight Loss
                    </option>

                    <option value="muscle gain">
                        Muscle Gain
                    </option>

                    <option value="general wellness">
                        General Wellness
                    </option>

                </select>

            </div>


            <!-- INTENSITY -->

            <div class="form-group">

                <label for="intensity">
                    Workout Intensity
                </label>

                <select
                    id="intensity"
                    name="intensity"
                    required
                >

                    <option value="low">
                        Low
                    </option>

                    <option
                        value="medium"
                        selected
                    >
                        Medium
                    </option>

                    <option value="high">
                        High
                    </option>

                </select>

            </div>


            <!-- BUTTON -->

            <button
                type="submit"
                class="primary-button"
            >
                🚀 Generate My Plan
            </button>

        </form>


        <div class="links">

            <a href="/view-all-users">
                👥 View All Users
            </a>

            <a href="/docs">
                📘 API Documentation
            </a>

        </div>

    </div>

</div>

</body>

</html>
